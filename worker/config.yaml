# Worker config — same structure as api/config.yaml
# Values can be overridden by environment variables

processing:
  crossfade_duration: 1
  target_lufs: -14
  true_peak_dbtp: -1.0
  output_resolution: "1920:1080"
  video_crf: 18
  audio_bitrate: "192k"
  trim_buffer: 2

drive:
  root_folder_id: ""
  intro_folder_id: ""
  outro_folder_id: ""
  output_folder_id: ""
  logs_folder_id: ""

youtube:
  default_privacy: "unlisted"
  default_category_id: "29"
  description_footer: |
    ---
    Church Name
    123 Main Street, Anytown, USA
    https://example.com
    Online Giving: https://example.com/give
